# This workflow will build a Java project with Maven
# For more information see: https://docs.github.com/en/actions/learn-github-actions or https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Java CI with Maven

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  # old-school build and jar method. No tests run or compiled.
  build-1_6: 
    name: Java 1.6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # setup-java@v1 can no longer resolve Java 6 from the Azul metadata API; fetch the Zulu 6 tarball directly
      - name: Download Zulu JDK 1.6
        run: curl -fsSL https://cdn.azul.com/zulu/bin/zulu6.22.0.3-jdk6.0.119-linux_x64.tar.gz -o "$RUNNER_TEMP/jdk.tar.gz"
      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: 1.6
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
      - name: Compile Java 1.6
        run: |
          mkdir -p target/classes
          javac -version
          javac -source 1.6 -target 1.6 -d target/classes/ src/main/java/org/json/*.java
      - name: Create java 1.6 JAR
        run: |
          jar cvf target/org.json.jar -C target/classes .
      - name: Upload JAR 1.6
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Create java 1.6 JAR
          path: target/*.jar

  build-8:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # in-process javac can overflow the default thread stack on newer JDKs
      MAVEN_OPTS: -Xss4m
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # build against supported Java LTS versions:
        java: [ 8 ]
    name: Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Compile Java ${{ matrix.java }}
        run: mvn clean compile -D maven.compiler.source=${{ matrix.java }} -D maven.compiler.target=${{ matrix.java }} -D maven.test.skip=true -D maven.site.skip=true -D maven.javadoc.skip=true
      - name: Run Tests ${{ matrix.java }}
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn test -D maven.compiler.source=${{ matrix.java }} -D maven.compiler.target=${{ matrix.java }} -Dtest=${{ inputs.test-filter }} -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn test -D maven.compiler.source=${{ matrix.java }} -D maven.compiler.target=${{ matrix.java }}
          fi
      - name: List Skipped Tests ${{ matrix.java }}
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  s = tc.find('skipped')
                  if s is not None:
                      n += 1
                      print('[WARNING] Skipped test: %s#%s -- skipped by upstream @Ignore, reason: %s' % (tc.get('classname'), tc.get('name'), s.get('message') or '(none given)'))
          print('Total skipped tests: %d' % n)
          PY
      - name: Build Test Report ${{ matrix.java }}
        if: ${{ always() }}
        run: |
          mvn surefire-report:report-only -D maven.compiler.source=${{ matrix.java }} -D maven.compiler.target=${{ matrix.java }}
          mvn site -D generateReports=false -D maven.compiler.source=${{ matrix.java }} -D maven.compiler.target=${{ matrix.java }}
      - name: Upload Test Results ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Results ${{ matrix.java }}
          path: target/surefire-reports/
      - name: Upload Test Report ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Report ${{ matrix.java }}
          path: target/site/
      - name: Package Jar ${{ matrix.java }}
        run: mvn clean package -D maven.compiler.source=${{ matrix.java }} -D maven.compiler.target=${{ matrix.java }} -D maven.test.skip=true -D maven.site.skip=true
      - name: Upload Package Results ${{ matrix.java }}
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Package Jar ${{ matrix.java }}
          path: target/*.jar

